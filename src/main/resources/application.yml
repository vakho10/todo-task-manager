spring:
  application:
    name: todo-task-manager
  datasource:
    url: jdbc:h2:file:~/todo-db
    username: admin
    password: admin
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false